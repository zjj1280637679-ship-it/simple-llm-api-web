<!doctype html><meta charset="utf-8"><title>Credential typing integrity QA</title>
<style>body{font:16px/1.6 system-ui;max-width:760px;padding:24px;margin:auto}button,a{padding:10px;margin:5px}pre{white-space:pre-wrap}</style>
<h1>逐字密钥输入：存档完整性 QA</h1><p>仅localhost合成样本；不发送任何API请求。准备样本会替换本localhost项目存档。不要使用真实密钥。</p>
<button id="seed">准备合成样本</button><a href="../../index.html">打开应用</a><button id="verify">验证已保存内容</button><pre id="result">等待操作</pre>
<ol><li>准备样本，打开应用。API卡密钥框依次填入 s → sk → sk- → sk-complete-fixture（每次触发input）；也可逐字键入。</li><li>不要点击发送或拉取模型。立即刷新。草稿应仍是“status signature sk-ordinary”，API地址仍有效，密钥框为空。</li><li>返回本页，点验证；应显示URL、原生单字签名、长签名、草稿、密钥字段排除全部PASS。</li></ol>
<script type="module">
import {createLocalStore,snapshotWorkspace} from '../../src/persistence.js';
const result=document.querySelector('#result'),base='https://generativelanguage.googleapis.com/v1beta',name='llm-workbench-local-v1:'+new URL('../../',location.href).pathname;
const allowed=()=>['localhost','127.0.0.1'].includes(location.hostname);
const make=()=>({api:{protocol:'gemini',url:base,key:'',model:'gemini-flash-lite-latest',supplier:'Google Gemini'},model:{inputs:['text'],output:'',temperature:'',topP:''},draft:'',attachments:[],messages:[],history:[],pendingTextId:null,lastMetrics:null,lastUsage:null,aspectRatio:'1:1',imageSize:'1K'});
document.querySelector('#seed').onclick=async()=>{if(!allowed()){result.textContent='仅localhost允许';return;}const data={chat:make(),image:make()};data.chat.draft='status signature sk-ordinary';data.chat.messages=[{id:1,type:'user',text:'status'},{id:2,type:'chatResult',text:'signed fixture'},{id:3,type:'card',kind:'api',values:{...data.chat.api}}];data.chat.history=[{role:'assistant',content:'status',raw:{parts:[{text:'status',thoughtSignature:'s'},{thoughtSignature:'sk-long-opaque-signature'}]}}];localStorage.removeItem(name+':draft-journal');const store=createLocalStore({name});await store.load();await store.schedule(snapshotWorkspace({data,page:'chat',nextId:4}),{immediate:true});store.close();result.textContent='样本已写入；打开应用，逐字填写虚构key，不要发送。';};
document.querySelector('#verify').onclick=async()=>{if(!allowed())return;const store=createLocalStore({name});const s=await store.load();store.close();if(!s){result.textContent='FAIL 无存档';return;}const d=s.workspaces.chat;const checks={URL:d.api.url===base,Draft:d.draft==='status signature sk-ordinary',SingleLetterSignature:d.history[0]?.raw?.parts?.[0]?.thoughtSignature==='s',LongSignature:d.history[0]?.raw?.parts?.[1]?.thoughtSignature==='sk-long-opaque-signature',NoCredentialFields:!('key' in d.api)&&!('trustedTarget' in d.api)&&!('key' in d.messages.find(m=>m.type==='card').values)};result.textContent=Object.entries(checks).map(([k,v])=>`${v?'PASS':'FAIL'} ${k}`).join('\n');};
</script>
