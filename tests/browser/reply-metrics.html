<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Per-response metrics offline QA</title><link rel="stylesheet" href="../../src/styles.css"><main style="max-width:800px;margin:auto;padding:20px"><h1>回复指标离线样例</h1><p>纯合成数据，无 fetch / API / 密钥。可在 320px、390px、桌面及深色模式查看换行。</p><div id="fixtures"></div></main><script type="module">
import {replyMetricsSnapshot,replyMetricsMarkup} from '../../src/usage.js';
const cases=[['第一轮 · 10 Token/s',replyMetricsSnapshot({inputTokens:100,cachedTokens:25,totalTokens:120},{chunks:2,durationMs:2000},20)],['第二轮 · 30 Token/s',replyMetricsSnapshot({inputTokens:200,cachedTokens:0,totalTokens:260},{chunks:2,durationMs:2000},60)],['单片段 · 速度未知',replyMetricsSnapshot({inputTokens:20,cachedTokens:0,totalTokens:25},{chunks:1,durationMs:null},5)],['缺失用量 / 无法拆思考词元',replyMetricsSnapshot(null)],['未完成（不显示成功用量）',null]];
document.querySelector('#fixtures').innerHTML=cases.map(([label,m])=>`<div class="message"><div class="assistant-message"><div class="assistant-label">${label}</div><div class="assistant-note reply-text">这是一段用于检查每条回复下方独立指标的合成文本。</div>${m?`<div class="reply-metrics">${replyMetricsMarkup(m)}</div>`:''}</div></div>`).join('');
</script>
