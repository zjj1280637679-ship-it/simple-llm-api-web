<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>思考参数离线验收</title>
<style>body{font:14px system-ui}iframe{width:430px;height:800px;max-width:100%;border:1px solid #aaa}pre{white-space:pre-wrap}button,select{margin:5px}</style>
<h1>思考模板 · 全离线</h1><p>先选配置，再在真实页面发送旁选择模板。所有请求截获，不访问供应商。报告仅含参数，无密钥。</p>
<select id="config"><option value="gemini">官方 Gemini 2.5 Flash</option><option value="openai">自定义 OpenAI</option><option value="anthropic">自定义 Anthropic</option><option value="unknown">官方未知 Gemini latest</option></select><button id="setup">填入合成配置（不发送）</button><button id="send">发送合成短句</button><button id="narrow">320px</button><pre id="report">等待</pre><iframe id="view" src="../../index.html" title="真实应用"></iframe>
<script>
const frame=document.querySelector('#view'),report=document.querySelector('#report');let count=0;
frame.onload=()=>{frame.contentWindow.fetch=async(url,options={})=>{
 const body=JSON.parse(options.body||'{}');report.textContent=JSON.stringify({synthetic:true,outboundNetwork:false,count:++count,path:new URL(url).pathname,generationConfig:body.generationConfig,reasoning_effort:body.reasoning_effort,thinking:body.thinking,output_config:body.output_config},null,2);
 const gemini=url.includes('generateContent')||url.includes('streamGenerateContent'),anthropic=url.endsWith('/messages');let events;
 if(anthropic)events=[{type:'message_start',message:{role:'assistant',content:[],usage:{input_tokens:2,output_tokens:0}}},{type:'content_block_start',index:0,content_block:{type:'text',text:''}},{type:'content_block_delta',index:0,delta:{type:'text_delta',text:'合成完成'}},{type:'content_block_stop',index:0},{type:'message_delta',delta:{stop_reason:'end_turn'},usage:{output_tokens:2}},{type:'message_stop'}];
 else events=gemini?[{candidates:[{content:{role:'model',parts:[{text:'合成完成'}]},finishReason:'STOP'}],usageMetadata:{promptTokenCount:2,totalTokenCount:4}}]:[{choices:[{index:0,delta:{content:'合成完成'},finish_reason:'stop'}]},'[DONE]'];
 const text=events.map(e=>(anthropic?'event: '+e.type+'\n':'')+'data: '+(typeof e==='string'?e:JSON.stringify(e))+'\n\n').join('');return new Response(text,{headers:{'content-type':'text/event-stream'}});
}};
document.querySelector('#setup').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow,k=document.querySelector('#config').value,proto=k==='unknown'?'gemini':k;
 d.querySelector('[data-action=tab][data-tab=chat]').click();d.querySelector('[data-action=plus]').click();d.querySelector('[data-action=new-card][data-kind=api]').click();d.querySelector('fieldset:not([disabled]) [data-action=supplier]').click();d.querySelector('[data-action=choose-supplier][data-index="'+({gemini:2,openai:3,anthropic:7})[proto]+'"]').click();
 for(const [key,value]of Object.entries({url:proto==='gemini'?'https://generativelanguage.googleapis.com/v1beta':'https://gateway.example/v1',key:'DUMMY-OFFLINE-ONLY',model:k==='gemini'?'gemini-2.5-flash':k==='unknown'?'gemini-latest':'custom-model'})){const n=d.querySelector('fieldset:not([disabled]) [data-key='+key+']');n.value=value;n.dispatchEvent(new w.Event('input',{bubbles:true}))}
};
document.querySelector('#send').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow,n=d.querySelector('#draft');n.value='合成短句';n.dispatchEvent(new w.Event('input',{bubbles:true}));d.querySelector('[data-action=send]').click()};
document.querySelector('#narrow').onclick=()=>frame.style.width='320px';
</script>
