<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>响应式离线验收台</title>
<style>body{margin:12px;font:14px/1.5 system-ui;background:#eee;color:#222}button,select{font:inherit;margin:4px;padding:6px}nav{display:flex;flex-wrap:wrap;align-items:center}iframe{display:block;background:white;border:1px solid #999;box-sizing:content-box}pre{white-space:pre-wrap;overflow-wrap:anywhere}.viewport{overflow:auto;max-width:100%}</style>
<h1>响应式离线验收台</h1><p>独立测试页，仅加载同源真实应用。不会填密钥或发送 API。长内容按钮会添加明确标记的合成显示数据；重新加载清空。200% 是字体压力测试，不冒称浏览器缩放。</p>
<nav><label>CSS 宽度<select id="width"><option>320</option><option>375</option><option>430</option><option>768</option><option>1280</option></select></label><label>高度<select id="height"><option>800</option><option>568</option><option>400</option></select></label><label>字体<select id="font"><option value="1">100%</option><option value="2">200%</option></select></label><button id="reload">重新加载</button><button id="api">API 设置</button><button id="model">模型设置</button><button id="chat">对话页</button><button id="image">图片页</button><button id="logs">日志页</button><button id="matrix">图片矩阵</button><button id="fixture">插入长内容</button><button id="long-chat">生成离线长对话</button><button id="stale-focus">旧焦点/截图事件压力</button><button id="send-scroll">发送滚动压力（合成）</button><button id="pending">离线加载指示</button><button id="pending-end">清除加载指示</button><button id="measure">测量</button></nav>
<pre id="report" aria-live="polite">等待加载</pre><div class="viewport"><iframe id="view" title="真实应用测试视口" src="../../index.html" width="320" height="800"></iframe></div>
<script>
const view=document.querySelector('#view'),report=document.querySelector('#report'),long='合成压力测试LongUnbrokenModelIdentifier0123456789'.repeat(5);
const doc=()=>view.contentDocument;
function size(){view.width=document.querySelector('#width').value;view.height=document.querySelector('#height').value;measure()}
function font(){const d=doc();d.querySelectorAll('[data-qa-font]').forEach(n=>{n.style.fontSize=n.dataset.qaFont;delete n.dataset.qaFont});if(document.querySelector('#font').value==='2'){const sizes=[...d.querySelectorAll('body *')].filter(n=>!n.closest('svg')).map(n=>[n,view.contentWindow.getComputedStyle(n).fontSize]);sizes.forEach(([n,f])=>{n.dataset.qaFont=n.style.fontSize;n.style.fontSize=(parseFloat(f)*2)+'px'})};measure()}
function click(selector){const n=doc().querySelector(selector);if(n)n.click();font()}
function card(kind){click('[data-action="plus"]');click('[data-action="new-card"][data-kind="'+kind+'"]')}
function measure(){const d=doc();if(!d?.body)return;requestAnimationFrame(()=>{const w=d.documentElement.clientWidth;const bad=[...d.querySelectorAll('body *')].filter(n=>{const s=view.contentWindow.getComputedStyle(n),r=n.getBoundingClientRect();return s.display!=='none'&&r.width>0&&(r.left< -1||r.right>w+1)&&!n.closest('svg')}).map(n=>({tag:n.tagName,class:n.className,left:Math.round(n.getBoundingClientRect().left),right:Math.round(n.getBoundingClientRect().right)}));report.textContent=JSON.stringify({at:new Date().toISOString(),width:w,height:view.height,fontScale:document.querySelector('#font').value,documentScrollWidth:d.documentElement.scrollWidth,horizontalOverflow:bad,scope:'real browser layout with synthetic display fixtures; no API acceptance'},null,2)})}
view.addEventListener('load',()=>{view.contentWindow.fetch=()=>Promise.reject(Error('QA network disabled'));font()});
document.querySelector('#width').onchange=size;document.querySelector('#height').onchange=size;document.querySelector('#font').onchange=font;
document.querySelector('#reload').onclick=()=>{view.src='../../index.html?qa='+Date.now()};
for(const p of ['chat','image','logs'])document.querySelector('#'+p).onclick=()=>click('[data-action="tab"][data-tab="'+p+'"]');
document.querySelector('#api').onclick=()=>card('api');document.querySelector('#model').onclick=()=>card('model');document.querySelector('#matrix').onclick=()=>{click('[data-action="tab"][data-tab="image"]');click('[data-action="size-toggle"]')};
document.querySelector('#fixture').onclick=()=>{const d=doc();let target=d.querySelector('.thread-inner');if(target){const box=d.createElement('div');box.className='message';const b=d.createElement('div');b.className='bubble';b.textContent=long;box.append(b);target.append(box)}for(const sel of ['.uniform-btn','.formfield>label','.menu-heading','.matrix-model','.sample-caption','.model-note','.compose-metrics span:first-child']){const n=d.querySelector(sel);if(n)n.textContent=long}const logs=d.querySelector('#network-logs');if(logs){const detail=d.createElement('details');detail.open=true;const sum=d.createElement('summary'),pre=d.createElement('pre');sum.textContent=long;pre.textContent=JSON.stringify({fixture:long,url:'https://example.invalid/'+long},null,2);detail.append(sum,pre);logs.append(detail)}font()};document.querySelector('#long-chat').onclick=async()=>{
 const d=doc(),w=view.contentWindow,blocked=()=>Promise.reject(Error('QA network disabled'));
 try {
  click('[data-action="tab"][data-tab="chat"]');card('api');
  for(const [key,value]of Object.entries({url:'https://api.example.com/v1',key:'SYNTHETIC-QA-ONLY',model:'fixture-model'})){
   const n=d.querySelector('[data-key="'+key+'"]');n.value=value;n.dispatchEvent(new w.Event('input',{bubbles:true}));
  }
  
  w.fetch=async()=>new Response('data: '+JSON.stringify({candidates:[{content:{role:'model',parts:[{text:('离线长对话，仅用于切页滚动验收。\n').repeat(35)}]},finishReason:'STOP'}]})+'\n\n',{status:200,headers:{'Content-Type':'text/event-stream'}});
  for(let i=0;i<4;i++){
   const input=d.querySelector('#draft');input.value='离线第'+(i+1)+'轮';input.dispatchEvent(new w.Event('input',{bubbles:true}));d.querySelector('[data-action="send"]').click();
   for(let j=0;j<200&&d.querySelector('[data-action="cancel"]');j++)await new Promise(r=>setTimeout(r,10));
   if(d.querySelector('[data-action="cancel"]'))throw Error('Synthetic request did not settle');
  }
  font();measure();
 }catch(e){report.textContent='离线夹具失败：'+e.message;}finally{w.fetch=blocked;}
};
document.querySelector('#stale-focus').onclick=async()=>{
 const d=doc(),w=view.contentWindow;
 try{
  await document.querySelector('#long-chat').onclick();
  const input=d.querySelector('[data-key="key"]'),app=d.querySelector('#app');
  input.focus({preventScroll:true});app.scrollTop=app.scrollHeight;
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const before=app.scrollTop;
  for(let i=0;i<30;i++){w.dispatchEvent(new w.Event('blur'));w.visualViewport?.dispatchEvent(new w.Event('resize'));w.visualViewport?.dispatchEvent(new w.Event('scroll'));d.dispatchEvent(new w.Event('visibilitychange'));}
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  report.textContent=JSON.stringify({scope:'Synthetic screenshot-like events, not physical iOS screenshot',before,after:app.scrollTop,delta:app.scrollTop-before,focusTag:d.activeElement?.tagName,focusId:d.activeElement?.id,diagnostics:w.__llmScrollDiagnostics?.().slice(-8)},null,2);
 }catch(e){report.textContent='旧焦点夹具失败：'+e.message;}
};
document.querySelector('#send-scroll').onclick=async()=>{
 const d=doc(),w=view.contentWindow;let resolve;
 try{
  await document.querySelector('#long-chat').onclick();
  w.fetch=()=>new Promise(r=>{resolve=r;});
  const input=d.querySelector('#draft');input.value='合成发送滚动测试 '+('长草稿 '.repeat(40));input.dispatchEvent(new w.Event('input',{bubbles:true}));
  d.querySelector('[data-action="send"]').click();
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const app=d.querySelector('#app'),before=app.scrollTop;
  for(let i=0;i<30;i++)w.visualViewport?.dispatchEvent(new w.Event('resize'));
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const last=d.querySelector('.message.user:last-of-type')||[...d.querySelectorAll('.message.user')].at(-1);
  const bubble=last?.getBoundingClientRect(),composer=d.querySelector('.composer-area').getBoundingClientRect();
  report.textContent=JSON.stringify({scope:'Synthetic viewport events, not physical mobile keyboard; mocked network',before,after:app.scrollTop,delta:app.scrollTop-before,lastMessageBottom:bubble?.bottom,composerTop:composer.top,visible:!bubble||bubble.bottom<=composer.top,activeElement:d.activeElement?.tagName},null,2);
 }catch(e){report.textContent='压力夹具失败：'+e.message;}
 finally{resolve?.(new Response(JSON.stringify({candidates:[{content:{parts:[{text:'合成请求完成'}]}}]}),{status:200,headers:{'Content-Type':'application/json'}}));w.fetch=()=>Promise.reject(Error('QA network disabled'));}
};
document.querySelector('#pending').onclick=()=>{const d=doc(),target=d.querySelector('.thread-inner');if(target&&!d.querySelector('[data-qa-pending]')){const wrapper=d.createElement('div');wrapper.className='message';wrapper.dataset.qaPending='true';wrapper.innerHTML='<div class="api-loading" role="status" aria-label="正在加载"><span class="api-spinner" aria-hidden="true"></span><span class="sr-only">正在加载</span></div>';target.append(wrapper)}font()};document.querySelector('#pending-end').onclick=()=>{doc().querySelector('[data-qa-pending]')?.remove();measure()};document.querySelector('#measure').onclick=measure;
</script></html>
