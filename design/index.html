<div class="shell" id="app"></div>
<!--
Design requirement: The first-page conversation agent can use a built-in CLI to invoke the second-page image workbench. "ci l" is interpreted as CLI.
Design recommendations (not additional confirmed user requirements): Both entry points should reuse the same image capability, parameters, and results; image results should be usable in the conversation. Keep the tool callable without locking it to a fixed workflow.
Scope: Requirements only. Do not implement live API calls, command execution, or additional UI explanation here.
-->
<script>
(()=>{'use strict';
// Development note: interactions are local-only; no live API requests are made.
const app=document.getElementById('app');
const icon=(name,size=18)=>{const path={chat:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8A8.5 8.5 0 0 1 12.5 20a8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8A8.5 8.5 0 0 1 12.5 3a8.5 8.5 0 0 1 8.5 8.5Z"/>',image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',settings:'<path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"/>',key:'<circle cx="8" cy="15" r="4"/><path d="m10.9 12.1 8-8L22 7l-3 3 2 2-3 3-2-2"/>',chev:'<path d="m6 9 6 6 6-6"/>',up:'<path d="m12 19 0-14m-6 6 6-6 6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>'}[name]||'';return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Google reference: https://ai.google.dev/gemini-api/docs/generate-content/image-generation#aspect_ratios_and_image_size
const IMAGE_MODEL='gemini-nano-banana-2.1',IMAGE_MODEL_NAME='Nano Banana 2.1';
const aspectRatios=[{ratio:'1:1',pixels:[1024,1024]},{ratio:'1:4',pixels:[512,2048]},{ratio:'1:8',pixels:[384,3072]},{ratio:'2:3',pixels:[848,1264]},{ratio:'3:2',pixels:[1264,848]},{ratio:'3:4',pixels:[896,1200]},{ratio:'4:1',pixels:[2048,512]},{ratio:'4:3',pixels:[1200,896]},{ratio:'4:5',pixels:[928,1152]},{ratio:'5:4',pixels:[1152,928]},{ratio:'8:1',pixels:[3072,384]},{ratio:'9:16',pixels:[768,1376]},{ratio:'16:9',pixels:[1376,768]},{ratio:'21:9',pixels:[1584,672]}];
const imageSizes=['1K','2K','4K'];
const imagePixels=(ratio,size)=>{const entry=aspectRatios.find(x=>x.ratio===ratio),scale={'1K':1,'2K':2,'4K':4}[size];return entry&&scale?entry.pixels.map(n=>n*scale).join('×'):''};
const supportsImageMatrix=d=>!d.api.model.trim()||d.api.model.trim()===IMAGE_MODEL;
const suppliers=[['OpenAI','https://api.openai.com/v1'],['火山方舟','https://ark.cn-beijing.volces.com/api/v3'],['智谱 AI','https://open.bigmodel.cn/api/paas/v4'],['DeepSeek','https://api.deepseek.com'],['自定义 · OpenAI 格式',''],['自定义 · Anthropic 格式',''],['自定义 · Gemini 格式','']];
const makePage=type=>({api:{url:'',key:'',model:'',supplier:'供应商'},model:{count:'1',format:'PNG',context:'',output:'',temperature:'',topP:'',inputs:['文本',...(type==='image'?['图片']:[])]},draft:'',pendingTextId:null,aspectRatio:'1:1',imageSize:'1K',messages:type==='image'?[{id:1,type:'user',text:'雨夜的未来都市，霓虹灯光，电影摄影风格。'},{id:2,type:'imageResult',aspectRatio:'1:1',imageSize:'1K',pixels:'1024×1024',count:'1'}]:[{id:3,type:'user',text:'你好'},{id:4,type:'chatResult',text:'你好！有什么我可以帮你的？'}]});
let page='image', plusOpen=false,sizeOpen=false,subMenu='',nextId=10;
const data={image:makePage('image'),chat:makePage('chat')};
const get=()=>data[page], activeCardId=()=>{const cards=get().messages.filter(x=>x.type==='card');return cards.length?cards[cards.length-1].id:null};
function addCard(type){const d=get();d.messages.push({id:nextId++,type:'card',kind:type,values:structuredClone(type==='api'?d.api:d.model),showKey:false});plusOpen=false;sizeOpen=false;subMenu='';render(true)}
function getCard(id){return get().messages.find(x=>x.id===id&&x.type==='card')}
function formfield(cardId,label,key,placeholder='',type='text') {const card=getCard(cardId);return `<div class="formfield"><label for="${key}${cardId}">${label}</label><input class="block-input" id="${key}${cardId}" data-card="${cardId}" data-key="${key}" placeholder="${placeholder}" value="${esc(card.values[key])}" type="${type}"/></div>`}
function apiCard(msg){const x=msg.values, isOld=msg.id!==activeCardId();const menus=subMenu.endsWith(':'+msg.id)?subMenu.split(':')[0]:'';return `<div class="card-wrap"><fieldset ${isOld?'disabled':''} style="border:0;padding:0;margin:0;min-width:0"><div class="setup-card ${isOld?'old':''}">${isOld?'<span class="disabled-tag">历史记录</span>':''}<div class="formfield"><label>API 地址</label><div class="fieldrow"><input data-card="${msg.id}" data-key="url" placeholder="https://api.example.com/v1" value="${esc(x.url)}"/><div class="sub-menu"><button type="button" data-action="supplier" data-id="${msg.id}" class="uniform-btn" title="选择供应商">${esc(x.supplier||'供应商')}</button>${menus==='supplier'?`<div class="inline-list">${suppliers.map(([label],i)=>`<button class="inline-item" data-action="choose-supplier" data-id="${msg.id}" data-index="${i}">${esc(label)}</button>`).join('')}</div>`:''}</div></div></div><div class="formfield"><label>API Key</label><div class="fieldrow"><input data-card="${msg.id}" data-key="key" type="${msg.showKey?'text':'password'}" placeholder="sk-..." autocomplete="off" value="${esc(x.key)}"/><button type="button" data-action="toggle-key" data-id="${msg.id}" class="uniform-btn">${msg.showKey?'隐藏':'显示'}</button></div></div><div class="formfield"><label>模型 ID</label><div class="fieldrow"><input data-card="${msg.id}" data-key="model" placeholder="输入或选择模型 ID" value="${esc(x.model)}"/><div class="sub-menu"><button type="button" data-action="pull-models" data-id="${msg.id}" class="uniform-btn">拉取模型</button>${menus==='models'?`<div class="inline-list">${(page==='image'?[IMAGE_MODEL,'自定义模型 ID']:['gpt-4.1-mini','deepseek-chat','glm-4','自定义模型 ID']).map(m=>`<button class="inline-item" data-action="choose-model" data-id="${msg.id}" data-model="${esc(m)}">${esc(m)}</button>`).join('')}</div>`:''}</div></div></div></div></fieldset></div>`}
function modelCard(msg){const x=msg.values,isOld=msg.id!==activeCardId();const opts=(page==='image'?['文本','图片','PDF']:['文本','图片','音频','视频','PDF']);return `<div class="card-wrap"><fieldset ${isOld?'disabled':''} style="border:0;padding:0;margin:0;min-width:0"><div class="setup-card ${isOld?'old':''}">${isOld?'<span class="disabled-tag">历史记录</span>':''}<div class="card-type">模型设置</div>${page==='chat'?`<div class="subgrid">${formfield(msg.id,'上下文上限','context','API 默认')}${formfield(msg.id,'最大输出 Token','output','API 默认')}${formfield(msg.id,'温度','temperature','API 默认')}${formfield(msg.id,'Top P','topP','API 默认')}</div>`:`<div class="subgrid"><div class="formfield"><label>生成数量</label><input class="block-input" data-card="${msg.id}" data-key="count" value="${esc(x.count)}" placeholder="1"/></div><div class="formfield"><label>输出格式</label><select class="native-select" data-card="${msg.id}" data-key="format">${['PNG','JPEG','WEBP'].map(s=>`<option ${x.format===s?'selected':''}>${s}</option>`).join('')}</select></div></div>`}<div class="fieldgroup" style="margin-top:17px"><span class="formlabel">输入模态</span><div class="chips">${opts.map(t=>`<button type="button" class="chip ${x.inputs.includes(t)?'sel':''}" data-action="toggle-input" data-id="${msg.id}" data-modality="${t}">${esc(t)}</button>`).join('')}</div></div></div></fieldset></div>`}
function resultMarkup(m){if(m.type==='chatResult')return `<div class="message"><div class="assistant-message"><div class="assistant-label">模型回复</div><div class="assistant-note">${esc(m.text)}</div></div></div>`;if(m.type==='imageResult')return `<div class="message"><div class="assistant-message"><div class="assistant-label">图片结果</div><div class="img-result"><div class="sample-art" role="img" aria-label="抽象城市夜景"><div class="tower a"></div><div class="tower b"></div><div class="tower c"></div><div class="lightline"></div></div><div class="sample-caption"><span>${esc(m.count)} 张 · ${esc(m.aspectRatio)} · ${esc(m.imageSize)}${m.pixels?` · ${esc(m.pixels)}`:''}</span></div></div></div></div>`;if(m.type==='error')return `<div class="message"><div class="mock-status">${esc(m.text)}</div></div>`;return ''}
function messageMarkup(m){if(m.type==='card')return `<div class="message">${m.kind==='api'?apiCard(m):modelCard(m)}</div>`;if(m.type==='user')return `<div class="message user"><div class="bubble">${esc(m.text)}</div></div>`;return resultMarkup(m)}
function plusMarkup(){return `<div class="menu-wrap"><button class="circle" aria-label="展开工具菜单" aria-expanded="${plusOpen}" data-action="plus">${icon('plus',22)}</button>${plusOpen?`<div class="plus-menu"><button data-action="new-card" data-kind="api">${icon('key')} API 设置</button><button data-action="new-card" data-kind="model">${icon('settings')} 模型设置</button></div>`:''}</div>`}
function sizeMarkup(){const d=get(),supported=supportsImageMatrix(d);return `<div class="menu-wrap"><button class="size-btn" type="button" data-action="size-toggle" aria-expanded="${sizeOpen}" ${sizeOpen?'aria-controls="image-options"':''} aria-label="${supported?`长宽比 ${esc(d.aspectRatio)}，分辨率 ${esc(d.imageSize)}；选择长宽比和分辨率`:'图片参数尚未验证'}">${supported?`${esc(d.aspectRatio)} · ${esc(d.imageSize)}`:'图片参数'} ${icon('chev',14)}</button>${sizeOpen?`<div class="size-menu" id="image-options"><div class="menu-heading"><span>长宽比与分辨率</span></div><div class="matrix-model" title="${IMAGE_MODEL}">${IMAGE_MODEL_NAME}</div>${supported?`<div class="matrix-scroll"><table class="option-matrix" aria-label="${IMAGE_MODEL_NAME} 图片长宽比与分辨率"><colgroup><col class="matrix-ratio-col"><col><col><col></colgroup><thead><tr><th scope="col">长宽比</th>${imageSizes.map(size=>`<th scope="col">${size}</th>`).join('')}</tr></thead><tbody>${aspectRatios.map(x=>`<tr><th scope="row"><span class="size-name">${x.ratio}</span></th>${imageSizes.map(size=>{const selected=d.aspectRatio===x.ratio&&d.imageSize===size,pixels=imagePixels(x.ratio,size);return `<td><button type="button" class="matrix-choice ${selected?'sel':''}" data-action="set-image-options" data-ratio="${x.ratio}" data-image-size="${size}" aria-label="长宽比 ${x.ratio}，${size}，${pixels}" aria-pressed="${selected}"><span class="matrix-mark" aria-hidden="true">${selected?'✓':''}</span><span class="matrix-pixels">${pixels}</span></button></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="matrix-notice">此模型的图片参数尚未验证。<br>本矩阵适用于 ${IMAGE_MODEL_NAME}。</div>`}</div>`:''}</div>`}
function render(scrollEnd=false){const d=get();app.innerHTML=`<main class="main"><header class="top"><span class="mobile-logo">极简 LLM</span><div class="tabs" role="tablist" aria-label="页面导航"><button role="tab" aria-selected="${page==='chat'}" class="tab ${page==='chat'?'active':''}" data-action="tab" data-tab="chat">对话</button><button role="tab" aria-selected="${page==='image'}" class="tab ${page==='image'?'active':''}" data-action="tab" data-tab="image">图片生成</button></div></header><section class="thread" id="thread"><div class="thread-inner"><div class="date">今天</div>${d.messages.map(messageMarkup).join('')}</div></section><footer class="composer-area"><div class="compose"><textarea id="draft" placeholder="${page==='image'?'描述你想生成的图片…':'输入消息…'}" aria-label="${page==='image'?'图片提示词':'聊天消息'}">${esc(d.draft)}</textarea><div class="compose-actions"><div class="left-actions">${plusMarkup()}</div><div class="right-actions">${page==='image'?sizeMarkup():''}<button class="send" data-action="send" title="${page==='image'?'生成图片':'发送消息'}" aria-label="发送">${icon('up')}</button></div></div></div><div class="compose-metrics">${page==='image'?'<span>图片 <strong>1</strong></span><span>Token <strong>—</strong></span><span>耗时 <strong>—</strong></span>':'<span>缓存命中 <strong>—</strong></span><span>Token <strong>—</strong></span><span>上下文 <strong>—</strong></span>'}</div></footer></main>`;if(scrollEnd)app.querySelector('#thread').scrollTop=app.querySelector('#thread').scrollHeight}
function handleAction(e){const el=e.target.closest('[data-action]');if(!el){if(e.target.closest('.size-menu'))return;if(plusOpen||sizeOpen||subMenu){plusOpen=sizeOpen=false;subMenu='';render()}return;}const act=el.dataset.action,d=get();const id=+(el.dataset.id||0);const card=getCard(id);
switch(act){case'tab':page=el.dataset.tab;plusOpen=sizeOpen=false;subMenu='';render();break;
case'plus':plusOpen=!plusOpen;sizeOpen=false;subMenu='';render();break;
case'new-card':addCard(el.dataset.kind);break;
case'size-toggle':sizeOpen=!sizeOpen;plusOpen=false;subMenu='';render();break;
case'set-image-options':if(page==='image'&&supportsImageMatrix(d)&&aspectRatios.some(x=>x.ratio===el.dataset.ratio)&&imageSizes.includes(el.dataset.imageSize)){const matrixScroll=app.querySelector('.matrix-scroll')?.scrollTop||0;d.aspectRatio=el.dataset.ratio;d.imageSize=el.dataset.imageSize;render();const matrix=app.querySelector('.matrix-scroll');if(matrix)matrix.scrollTop=matrixScroll}break;
case'supplier':subMenu=subMenu===`supplier:${id}`?'':`supplier:${id}`;render();break;
case'choose-supplier':{const [label,url]=suppliers[+el.dataset.index];card.values.supplier=label.startsWith('自定义')?'自定义':label;card.values.url=url;d.api=structuredClone(card.values);subMenu='';render();break}
case'toggle-key':card.showKey=!card.showKey;render();break;
case'pull-models':subMenu=subMenu===`models:${id}`?'':`models:${id}`;render();break;
case'choose-model':card.values.model=el.dataset.model==='自定义模型 ID'?'':el.dataset.model;d.api=structuredClone(card.values);subMenu='';render();break;
case'toggle-input':{const inputs=card.values.inputs;const mod=el.dataset.modality; if(inputs.includes(mod)){if(mod!=='文本')card.values.inputs=inputs.filter(x=>x!==mod)}else{card.values.inputs.push(mod)}d.model=structuredClone(card.values);render();break}
case'send':send();break;
}}
function send(){const d=get(),text=d.draft.trim();if(!text)return;const pending=d.messages.find(m=>m.id===d.pendingTextId);const pendingSame=pending&&pending.text===text;plusOpen=sizeOpen=false;subMenu='';if(!d.api.url||!d.api.key||!d.api.model){if(!pendingSame){const msg={id:nextId++,type:'user',text};d.messages.push(msg);d.pendingTextId=msg.id;}d.draft=text;addCard('api');return;}if(page==='image'&&!supportsImageMatrix(d)){d.messages.push({id:nextId++,type:'error',text:'此模型的图片参数尚未验证，请选择 Nano Banana 2.1。'});render(true);return;}if(!pendingSame)d.messages.push({id:nextId++,type:'user',text});d.draft='';d.pendingTextId=null;if(page==='image')d.messages.push({id:nextId++,type:'imageResult',aspectRatio:d.aspectRatio,imageSize:d.imageSize,pixels:imagePixels(d.aspectRatio,d.imageSize),count:d.model.count||'1'});else d.messages.push({id:nextId++,type:'chatResult',text:'已收到你的消息。'});render(true)}
app.addEventListener('click',handleAction);
app.addEventListener('input',e=>{const t=e.target;if(t.id==='draft'){get().draft=t.value;return}const id=+(t.dataset.card||0),key=t.dataset.key;if(!id||!key)return;const card=getCard(id);if(!card||id!==activeCardId())return;card.values[key]=t.value;if(card.kind==='api'){get().api=structuredClone(card.values)}else{get().model=structuredClone(card.values)}});
app.addEventListener('change',e=>{const t=e.target;const id=+(t.dataset.card||0),key=t.dataset.key;if(!id||!key)return;const card=getCard(id);if(card&&id===activeCardId()){card.values[key]=t.value;if(card.kind==='model')get().model=structuredClone(card.values)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(plusOpen||sizeOpen||subMenu)){e.preventDefault();plusOpen=sizeOpen=false;subMenu='';render();return;}if(e.target.id==='draft'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
render();
})();
</script>
</body>
</html>
