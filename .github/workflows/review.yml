name: Review candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node knowledge/check.mjs
      - run: node knowledge/verify.mjs
      - run: npm run check
      - run: npm run review:health
      - run: npm run review:evidence
      - run: npm run review:sources
      - run: npm run hosts
      - run: npm run models
      - run: npm test
      - run: npm run build
